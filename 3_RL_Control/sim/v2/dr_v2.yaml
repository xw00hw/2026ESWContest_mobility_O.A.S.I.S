# O.A.S.I.S L3 v2 domain-randomisation spec (2026-10-25)
# Built on: refined car run2 (passenger on the mat), bench 2026-10-25 (one subject, static),
# calib_v2.json (one physical model fitted to both). Tags as in v0.1:
#   L1 car data | BENCH bench data | CAL derived by calib_v2 | LIT literature | ASM assumption
# Team assumption: tightening increases same-side pressure (bench right-yaw sign flipped).

sim:
  dt_physics: 0.005
  dt_control: 0.05
  episode_s: 40.0
  horizon_pred_s: 1.0

scenario:
  mix: {l1_replay: 0.35, urban_turn: 0.2, lane_change: 0.15, slalom: 0.15, steady_circle: 0.05, random_steer: 0.05, beamng: 0.05}
  l1_amp_scale:      {dist: uniform, range: [0.8, 1.6], nominal: 1.0, level: 1, src: ASM}
  l1_time_scale:     {dist: uniform, range: [0.8, 1.25], nominal: 1.0, level: 1, src: ASM}
  ay_peak_g:         {dist: uniform, range: [0.05, 0.5], nominal: [0.1, 0.35], level: 2, src: "L1 turns 0.12-0.375 g"}
  jerk_peak_gps:     {dist: loguniform, range: [0.1, 1.2], nominal: [0.15, 0.5], level: 2, src: L1}
  speed_kph:         {dist: uniform, range: [10, 70], nominal: [15, 55], level: 1, src: L1}
  turn_radius_m:     {dist: uniform, range: [6, 40], nominal: [8, 25], level: 0, src: ASM}
  lane_change_period_s: {dist: uniform, range: [2.5, 6.0], nominal: [3.0, 5.0], level: 1, src: LIT}
  slalom_freq_hz:    {dist: uniform, range: [0.15, 0.5], nominal: [0.2, 0.35], level: 1, src: ASM}
  straight_gap_s:    {dist: uniform, range: [1.5, 8.0], nominal: [3.0, 8.0], level: 0, src: ASM}

vehicle:
  wheelbase_m:       {dist: uniform, range: [2.75, 2.9], nominal: 2.85, level: 0, src: "ASM (vehicle spec assumed from the refined data)"}
  steer_ratio:       {dist: normal, mean: 13.5, sd: 1.0, clip: [11, 16], level: 0, src: L1}
  understeer_K:      {dist: uniform, range: [0.002, 0.012], nominal: 0.006, level: 0, src: L1}
  yaw_lag_tau_s:     {dist: uniform, range: [0.08, 0.3], nominal: 0.15, level: 1, src: ASM}
  mu_road:           {dist: uniform, range: [0.5, 1.0], nominal: 0.9, level: 2, src: ASM}
  road_bank_deg:     {dist: uniform, range: [-2, 2], nominal: 0, level: 1, src: L1}
  ax_coupling_g:     {dist: uniform, range: [0.0, 0.25], nominal: 0.1, level: 1, src: L1}

profile:            # body build -- one measured subject, population ranges are LIT; the policy sees a noisy estimate
  mass_kg:           {dist: uniform, range: [50, 100], nominal: 72, level: 0, src: "LIT (1 subject measured)"}
  shoulder_width_m:  {dist: uniform, range: [0.36, 0.48], nominal: 0.42, level: 0, src: LIT}
  sitting_torso_m:   {dist: uniform, range: [0.50, 0.66], nominal: 0.58, level: 0, src: LIT}
  estimate_noise_frac: 0.08            # profile estimate from rest pressure + calibrated camera
  chair_half_gap_m: 0.20               # ASM: bolster pad clearance from seat centre at yaw 0

human:              # same structure as v0.2 (validated against L1); passenger archetype = L1 subject on the mat
  archetype:         {dist: choice, values: [passenger, driver], p: [0.6, 0.4], level: 0, src: "L1 pressure = passenger"}
  fn_torso_hz:       {dist: lognormal, median: 1.6, logsd: 0.4, clip: [0.8, 3.5], level: 0, src: "L1 + LIT"}
  zeta_torso:        {dist: uniform, range: [0.8, 3.0], nominal: 1.5, level: 0, src: L1}
  passive_frac:      {dist: uniform, range: [0.3, 0.8], nominal: 0.5, level: 1, src: ASM}
  reflex_delay_s:    {dist: uniform, range: [0.04, 0.15], nominal: 0.08, level: 0, src: "L1 (seat lag 0.1-0.3 s incl. clock)"}
  fn_pelvis_hz:      {dist: uniform, range: [2.5, 6.0], nominal: 4.0, level: 0, src: ASM}
  zeta_pelvis:       {dist: uniform, range: [0.8, 2.5], nominal: 1.5, level: 0, src: ASM}
  mu_cushion:        {dist: uniform, range: [0.3, 0.7], nominal: 0.5, level: 1, src: ASM}
  lean_bias_deg:     {dist: normal, mean: 0, sd: 2.0, level: 0, src: ASM}
  relax_gain:        {dist: uniform, range: [0.0, 2.0], nominal: 0.0, level: 1, src: "unobservable interaction (triad_check)"}
  driver:
    brace_k_Nm_rad:  {dist: uniform, range: [0, 150], nominal: 60, level: 0, src: ASM}
    ff_gain:         {dist: uniform, range: [0.0, 0.5], nominal: 0.2, level: 0, src: LIT}
    ff_lead_s:       {dist: uniform, range: [0.0, 0.5], nominal: 0.2, level: 0, src: ASM}
  passenger:
    brace_k_Nm_rad:  {dist: uniform, range: [0, 20], nominal: 0, level: 0, src: ASM}
    ff_gain:         {dist: uniform, range: [-0.15, 0.25], nominal: 0.0, level: 0, src: LIT}
    ff_lead_s:       {dist: uniform, range: [-0.2, 0.2], nominal: 0.0, level: 0, src: ASM}
  door:              # un-instrumented door/armrest support on the outboard side
    p_present: 0.5
    k_over_contact:  2.0                  # CAL: drive-replay door/console ratio 0.44 (car 0.48); static fit gave 6.6 (x lognormal 0.35 in env)

seat_bolster:        # 2 DOF/side on the bench; v2 controls YAW only (pitch effect r2 < 0.1 except one channel)
  theta_max_deg: 20                    # BENCH validated kinematic range (27 tested, unvalidated)
  contact_k:         {dist: loguniform, range: [1000, 10000], nominal: 3000, level: 0, src: "CAL: not identifiable"}
  authority_scale:   {dist: lognormal, median: 1.0, logsd: 0.35, clip: [0.5, 2.0], level: 0,
                      src: "CAL: bench/car counts-per-N may differ; ratio 0.00217 g/deg x this"}
  side_preload_N:    {dist: uniform, range: [5, 40], nominal: 20, level: 0, src: "BENCH/L1: side channels loaded at rest"}
  h_bolster_m:       {dist: uniform, range: [0.15, 0.25], nominal: 0.20, level: 0, src: ASM}
  c_contact:         {dist: uniform, range: [100, 400], nominal: 250, level: 0, src: ASM}
  servo_rate_dps: 15                   # 'ramp' mode only (v2 training of 2026-10-25): structure yaw ramp
  actuator_mode: ramp                  # ramp | fw_event | fw_stream | fw_track (see FirmwareServo)
  crank_rate_dps: 15                   # firmware MOTOR_RATE_MDEG_S/1000 (crank, not structure; yaw ~ crank/2.3)
  fw_deadband_deg: 0.5
  servo_cmd_latency_s: [0.05, 0.25]    # BENCH: command->first state change <= 1 report (200 ms)
  servo_tau_s: [0.03, 0.15]            # ASM (hobby servo)
  servo_backlash_deg: [0.0, 2.0]       # BENCH: approach-direction difference 85 counts ~ part servo, part FSR
  servo_compliance_deg_per_Nm: [0.0, 0.5]   # ASM: deflection under load (no feedback available)

sensors:
  side_counts_per_N: 32.6              # CAL at k = 3000; env re-anchors per sampled k so counts/g stays at the car value
  side_gain_scale: [0.5, 2.0]          # CAL residual: per-channel bench check off by up to 2x
  side_base_counts: [400, 1600]        # L1 1456/587, BENCH 580-1220
  noise_counts: [2.0, 50.0]            # L1 1-7, BENCH 22-58 (servo-powered rig)
  hyst_frac: [0.05, 0.25]              # BENCH 21 % of the 0-27 deg effect
  pad_tau_s: [0.05, 0.15]              # L1 first-order 0.085 s
  p_dead: 0.05
  pose_rate_hz: [8, 12]
  pose_latency_s: [0.05, 0.12]
  pose_lean_gain: [0.7, 1.3]           # frontal camera (bench); car side view cannot see lateral lean
  pose_lean_noise_deg: [0.2, 0.5]      # BENCH within-dwell 0.27-0.40 deg
  imu_rate_hz: [10, 100]
  imu_latency_s: [0.002, 0.05]         # L1 serial 45.8 ms
  imu_ay_noise_mps2: [0.02, 0.10]
  imu_bias_mps2: 0.05
  imu_misalign_deg: 2.5                # L1 refined yaw uncertainty
  obd_rate_hz: [0.9, 1.2]
  obd_latency_s: [0.1, 1.0]
  speed_quant_kph: 1.0
  pred_sigma0_g: [0.005, 0.02]
  pred_sigma_per_s_g: [0.01, 0.06]
  pred_gain: [0.8, 1.1]
  pred_lag_s: [0.0, 0.15]

reward:              # pressure never in the reward (review doc 5-D)
  w_com: 1.0
  com_scale_m: 0.02
  counterfactual: true   # CoM term = y^2 - y_twin^2 (twin = same occupant, bolsters open); sim-only
  w_du: 0.05
  w_theta: 0.01
  w_force: 0.05      # squeeze the bolsters ADD vs the twin, (per force_scale_N)^2 -- sim only
  force_scale_N: 20  # constant 10 deg clamping adds ~8 N for ~1 % CoM reduction; keep it from being free
  w_trip: 1.0

safety:              # servo rig: no motor current -> interlock on the side-FSR force estimate
  mode: model          # model: FSR force minus calibrated inertial load from the IMU (squeeze only); total: raw FSR force
  fsr_force_soft_N: 60     # hold (no further closing) above rest
  fsr_force_hard_N: 120    # release that side, only if it is closed
  arm_deg: 2.0
  hold_s: 0.3
  rate_limit_dps: 15
